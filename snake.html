<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 30%, #1b2a1e, #0a0f0b);
    font-family: system-ui, sans-serif;
    color: #e8f5e9;
  }
  .game {
    text-align: center;
  }
  canvas {
    background: #0e150f;
    border: 3px solid #2f5233;
    border-radius: 14px;
    box-shadow: 0 0 40px rgba(46, 125, 50, 0.45), inset 0 0 20px rgba(0,0,0,0.6);
    display: block;
    margin: 0 auto 14px;
  }
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 30px;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .scoreboard span {
    text-shadow: 0 0 12px rgba(76, 175, 80, 0.6);
  }
  .scoreboard .high {
    color: #ffd54f;
    text-shadow: 0 0 16px rgba(255, 213, 79, 0.7);
  }
  button {
    background: linear-gradient(180deg, #43a047, #2e7d32);
    border: none;
    color: white;
    padding: 10px 24px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(46, 125, 50, 0.5);
  }
  button:hover {
    background: linear-gradient(180deg, #4caf50, #388e3c);
  }
</style>
</head>
<body>
<div class="game">
  <div class="scoreboard">
    <div>Score: <span id="score">0</span></div>
    <div class="high">🏆 High: <span id="highScore">0</span></div>
  </div>
  <canvas id="board" width="400" height="400"></canvas>
  <button id="restart">Restart</button>
</div>
<script>
(() => {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');

  const GRID = 20;
  const CELL = canvas.width / GRID;

  let snake, dir, nextDir, food, score, alive, timer;
  let particles = [];
  let foodPulse = 0;
  let highScore = parseInt(localStorage.getItem('snakeHighScore')) || 0;
  let celebrationActive = false;
  let celebrationTimer = 0;

  highScoreEl.textContent = highScore;

  function getInterval() {
    // start at 150ms, decrease by 0.8ms per point, floor at 60ms
    const speed = Math.max(60, 150 - score * 0.8);
    return Math.round(speed);
  }

  function reset() {
    snake = [{ x: 10, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    alive = true;
    particles = [];
    celebrationActive = false;
    celebrationTimer = 0;
    scoreEl.textContent = score;
    placeFood();
    clearInterval(timer);
    const interval = getInterval();
    timer = setInterval(tick, interval);
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      if (!snake.some(seg => seg.x === f.x && seg.y === f.y)) {
        food = f;
        return;
      }
    }
  }

  function burst(cx, cy, color, count = 18, speedBase = 1.5) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const speed = speedBase + Math.random() * 2.5;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color,
        size: 2 + Math.random() * 4
      });
    }
  }

  function celebrationBurst(cx, cy) {
    const colors = ['#ffd700', '#ff6b6b', '#ff9f43', '#feca57', '#48dbfb', '#1dd1a1', '#a29bfe', '#fd79a8', '#ff7675'];
    for (let i = 0; i < 60; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 2 + Math.random() * 4;
      const color = colors[Math.floor(Math.random() * colors.length)];
      particles.push({
        x: cx + (Math.random() - 0.5) * 20,
        y: cy + (Math.random() - 0.5) * 20,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color,
        size: 3 + Math.random() * 5
      });
    }
  }

  function tick() {
    if (!alive) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID ||
        snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      alive = false;
      clearInterval(timer);
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      burst(
        food.x * CELL + CELL / 2,
        food.y * CELL + CELL / 2,
        '#ff5252'
      );

      // Check for high score
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('snakeHighScore', String(highScore));
        highScoreEl.textContent = highScore;
        // Celebration!
        celebrationActive = true;
        celebrationTimer = 60;
        celebrationBurst(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
        // extra bursts around
        for (let i = 0; i < 3; i++) {
          setTimeout(() => {
            celebrationBurst(
              Math.random() * canvas.width,
              Math.random() * canvas.height
            );
          }, i * 200);
        }
      }

      placeFood();
      // Speed up: reset timer with new interval
      clearInterval(timer);
      const interval = getInterval();
      timer = setInterval(tick, interval);
    } else {
      snake.pop();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let x = 0; x < GRID; x++) {
      for (let y = 0; y < GRID; y++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.02)';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    const glow = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, 10,
      canvas.width / 2, canvas.height / 2, canvas.width / 1.5
    );
    glow.addColorStop(0, 'rgba(76, 175, 80, 0.08)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawFood() {
    foodPulse += 0.08;
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const pulse = 1 + Math.sin(foodPulse) * 0.15;

    ctx.save();
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 16;

    const grad = ctx.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, CELL / 2);
    grad.addColorStop(0, '#ff8a80');
    grad.addColorStop(0.5, '#e53935');
    grad.addColorStop(1, '#8e0000');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, (CELL / 2 - 2) * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#4caf50';
    ctx.fillRect(cx - 2, cy - CELL / 2 - 2, 4, 5);
  }

  function drawSnake() {
    snake.forEach((seg, i) => {
      const x = seg.x * CELL + 2;
      const y = seg.y * CELL + 2;
      const s = CELL - 4;
      const t = i / Math.max(snake.length - 1, 1);
      const r = 40 + Math.floor(60 * t);
      const g = 190 + Math.floor(50 * t);
      const b = 60 - Math.floor(25 * t);
      const color = `rgb(${r}, ${g}, ${b})`;

      ctx.save();
      if (i === 0) {
        ctx.shadowColor = '#4caf50';
        ctx.shadowBlur = 12;
      }
      ctx.fillStyle = color;
      roundRect(x, y, s, s, 6);
      ctx.fill();
      ctx.restore();

      if (i === 0) {
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(x + s * 0.35, y + s * 0.35, 2, 0, Math.PI * 2);
        ctx.arc(x + s * 0.65, y + s * 0.35, 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(x + s * 0.35, y + s * 0.35, 1, 0, Math.PI * 2);
        ctx.arc(x + s * 0.65, y + s * 0.35, 1, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function drawParticles() {
    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.04;
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size || 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function drawGameOver() {
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#ff5252';
    ctx.font = 'bold 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 20;
    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 8);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e8f5e9';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText('Press Restart to play again', canvas.width / 2, canvas.height / 2 + 28);
  }

  function draw() {
    drawBackground();
    drawFood();
    drawParticles();
    drawSnake();
    if (!alive) drawGameOver();
    requestAnimationFrame(draw);
  }

  document.addEventListener('keydown', (e) => {
    if (!alive) return;
    switch (e.key) {
      case 'ArrowUp':
        if (dir.y !== 1) nextDir = { x: 0, y: -1 };
        e.preventDefault();
        break;
      case 'ArrowDown':
        if (dir.y !== -1) nextDir = { x: 0, y: 1 };
        e.preventDefault();
        break;
      case 'ArrowLeft':
        if (dir.x !== 1) nextDir = { x: -1, y: 0 };
        e.preventDefault();
        break;
      case 'ArrowRight':
        if (dir.x !== -1) nextDir = { x: 1, y: 0 };
        e.preventDefault();
        break;
    }
  });

  document.getElementById('restart').addEventListener('click', reset);

  reset();
  draw();
})();
</script>
</body>
</html>
